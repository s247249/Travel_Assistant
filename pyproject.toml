authors = [
    { name = "Ermes La Porta s315194", email = "s247249@studenti.polito.it" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "email-validator>=2.4.0",
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "itsdangerous>=2.2.0",
    "langchain-google-genai>=4.5.2",
    "langchain-text-splitters>=1.1.3",
